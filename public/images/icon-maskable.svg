<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="BYBHUB">
  <!--
    Maskable icon — the "safe zone" for adaptive icons is a centred circle
    with radius = 40% of the viewBox (≈ 204px at 512). All meaningful artwork
    sits inside that circle; the remaining bleed area is the brand navy.
    The full 512x512 background fills the shape when the OS applies a mask.
  -->
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E4FA3"/>
      <stop offset="100%" stop-color="#1A3A6B"/>
    </linearGradient>
  </defs>

  <!-- Full bleed navy background — fills any mask shape the OS applies -->
  <rect width="512" height="512" fill="url(#bgm)"/>

  <!-- Inner white card — safe-zone square (20% inset each side = 102px inset → 308×308 centred) -->
  <rect x="102" y="102" width="308" height="308" rx="64" ry="64" fill="#1A3A6B"/>

  <!-- ── Sailboat (white, within safe zone) ── -->
  <path d="M222 290 L256 158 L310 290 Z" fill="white" opacity="0.97"/>
  <path d="M196 290 L222 202 L258 290 Z" fill="white" opacity="0.87"/>
  <!-- Hull -->
  <path d="M182 295 Q256 318 330 295 L318 308 Q256 330 194 308 Z" fill="white"/>
  <!-- Waves -->
  <path d="M175 322 Q210 313 245 322 Q280 332 315 322" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.7"/>

  <!-- ── Globe (accent orange, bottom-left of safe zone) ── -->
  <circle cx="162" cy="366" r="46" fill="#F47B20"/>
  <ellipse cx="162" cy="366" rx="46" ry="20" fill="none" stroke="#D4660E" stroke-width="3" opacity="0.7"/>
  <path d="M162 320 Q180 342 180 366 Q180 390 162 412" fill="none" stroke="#D4660E" stroke-width="2.5" opacity="0.6"/>
  <path d="M162 320 Q144 342 144 366 Q144 390 162 412" fill="none" stroke="#D4660E" stroke-width="2.5" opacity="0.6"/>
  <circle cx="162" cy="366" r="46" fill="none" stroke="#E8650A" stroke-width="3.5"/>
</svg>
