<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="BYBHUB">
  <defs>
    <!-- Rounded-square background gradient matching the brand navy tile -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E4FA3"/>
      <stop offset="100%" stop-color="#1A3A6B"/>
    </linearGradient>
    <!-- White sailboat fill -->
    <clipPath id="tileClip">
      <rect x="30" y="30" width="452" height="452" rx="96" ry="96"/>
    </clipPath>
  </defs>

  <!-- Navy rounded-square tile (slightly rotated like the real logo) -->
  <g transform="rotate(-8 256 256)">
    <rect x="30" y="30" width="452" height="452" rx="96" ry="96" fill="url(#bg)"/>
  </g>

  <!-- ── Sailboat (white, centred slightly upper) ── -->
  <!-- Main sail (large) -->
  <path d="M210 310 L270 120 L340 310 Z" fill="white" opacity="0.97"/>
  <!-- Secondary sail (smaller, left) -->
  <path d="M175 310 L210 175 L255 310 Z" fill="white" opacity="0.87"/>
  <!-- Boat hull -->
  <path d="M158 315 Q256 345 354 315 L340 330 Q256 358 172 330 Z" fill="white"/>
  <!-- Water waves under hull -->
  <path d="M148 342 Q185 332 222 342 Q259 352 296 342 Q333 332 370 342" fill="none" stroke="white" stroke-width="10" stroke-linecap="round" opacity="0.75"/>
  <path d="M160 360 Q197 350 234 360 Q271 370 308 360 Q345 350 360 360" fill="none" stroke="white" stroke-width="7" stroke-linecap="round" opacity="0.55"/>

  <!-- ── Globe (accent orange, bottom-left overlap like the real logo) ── -->
  <circle cx="152" cy="395" r="62" fill="#F47B20"/>
  <!-- Globe latitude lines -->
  <ellipse cx="152" cy="395" rx="62" ry="28" fill="none" stroke="#D4660E" stroke-width="3.5" opacity="0.7"/>
  <ellipse cx="152" cy="380" rx="55" ry="16" fill="none" stroke="#D4660E" stroke-width="3" opacity="0.5"/>
  <!-- Globe longitude lines -->
  <path d="M152 333 Q175 360 175 395 Q175 430 152 457" fill="none" stroke="#D4660E" stroke-width="3" opacity="0.6"/>
  <path d="M152 333 Q129 360 129 395 Q129 430 152 457" fill="none" stroke="#D4660E" stroke-width="3" opacity="0.6"/>
  <!-- Globe outline ring -->
  <circle cx="152" cy="395" r="62" fill="none" stroke="#E8650A" stroke-width="4"/>
</svg>
